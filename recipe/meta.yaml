{% set name = "fastparquet" %}
{% set version = "2026.5.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 12a813d1c91b9d316a8d43860074daf4566849f776f9cd549742aa71d907e4f6

build:
  number: 0
  skip: true  # [py<310]
  script:
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    # build fails at setup.py line 50 with subprocess execution on win
    # subprocess.call(["git", "status"], stdout=sys.stdout, stderr=sys.stderr)
    # https://github.com/dask/fastparquet/blob/2159d9cdc4e03d220b630af4232c3dbb225f4ba8/setup.py#L50
    - git  # [win or linux]
  host:
    - python
    - pip
    # upstream source https://github.com/dask/fastparquet/blob/2026.5.0/pyproject.toml
    - setuptools
    - setuptools-scm
    - cython >=0.29.31
    - numpy >=2.0.0rc1
  run:
    # upstream source https://github.com/dask/fastparquet/blob/2026.5.0/requirements.txt
    - python
    - pandas >=1.5.0
    - numpy
    - cramjam >=2.3
    - fsspec
    - packaging

test:
  imports:
    - fastparquet
    - fastparquet.cencoding
    - fastparquet.speedups
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/dask/fastparquet
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Python interface to the parquet format
  description: |
    The fastparquet is a python implementation of the parquet format, aiming integrate into python-based big data work-flows.
    It is used implicitly by the projects Dask, Pandas and intake-parquet.
    The Parquet format is a common binary data store, used particularly in the Hadoop/big-data sphere.
    It provides several advantages relevant to big-data processing.
  dev_url: https://github.com/dask/fastparquet
  doc_url: https://fastparquet.readthedocs.io

extra:
  recipe-maintainers:
    - martindurant
    - mrocklin
    - TomAugspurger
  skip-lints:
    - host_section_needs_exact_pinnings
